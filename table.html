<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar table</title>
</head>
<body>
    <h1>Belajar table</h1>
    <table style="border: 1px solid black;">
        <colgroup>
            <col span="2" style="background-color: aquamarine;">
            <col style="background-color: aqua;">
        </colgroup>
        <thead>
            <tr>
                <th colspan="2">Nama</th>
                <th>nilai</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Rusdi</td>
                <td>Simanjuntak</td>
                <td>89</td>
            </tr>
            <tr>
                <td>kevin</td>
                <td>Nasution</td>
                <td>95</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td rowspan="2">Total</td>
                <td>Total</td>
                <td>184</td>
            </tr>
            <tr>
                <td>Rata-Rata</td>
                <td>90</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
